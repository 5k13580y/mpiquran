<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPI Sumber Hukum Islam – Kelas X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--sf:#fff;--tx:#1f2933;--mu:#5b6770;--pr:#14532d;--pr2:#166534;--ac:#d97706;--ln:#e2e8e0;--ok:#15803d;--ko:#b91c1c;--soft:#e8f5ec;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a14;--sf:#17251d;--tx:#e8efe9;--mu:#9fb0a5;--pr:#0b3d20;--pr2:#4ade80;--ac:#fbbf24;--ln:#2a3d31;--ok:#4ade80;--ko:#f87171;--soft:#1d3226}}
:root[data-theme=dark]{--bg:#0f1a14;--sf:#17251d;--tx:#e8efe9;--mu:#9fb0a5;--pr:#0b3d20;--pr2:#4ade80;--ac:#fbbf24;--ln:#2a3d31;--ok:#4ade80;--ko:#f87171;--soft:#1d3226}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex}
aside{width:270px;background:var(--pr);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
aside h1{font-size:16px;margin:0;padding:20px 18px 4px}aside small{padding:0 18px;opacity:.75;display:block}
.bar{margin:14px 18px;height:8px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}
nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:12px 18px;cursor:pointer;border-left:4px solid transparent;font-size:14px}
nav button:hover{background:rgba(255,255,255,.1)}nav button.on{background:rgba(0,0,0,.25);border-color:var(--ac);font-weight:600}nav button:focus-visible{outline:2px solid var(--ac)}
nav .d{margin-left:auto;opacity:.9}
main{flex:1;overflow-y:auto;padding:28px clamp(16px,4vw,56px);scroll-behavior:smooth}
.wrap{max-width:860px;margin:0 auto}
.top{display:none}
h2{font-size:clamp(22px,4vw,30px);margin:0 0 6px;color:var(--pr2)}h3{margin:28px 0 10px;font-size:18px}
.lead{color:var(--mu);margin:0 0 18px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin:12px 0}
.ay{border-left:5px solid var(--ac)}
.ar{font-family:Amiri,serif;font-size:27px;line-height:2.1;text-align:right;direction:rtl;margin:0}
.ref{font-weight:600;color:var(--pr2);font-size:13px;margin-top:4px}.tr{margin:4px 0 0;font-size:14.5px}
.acc>button,.tabs>.tb button,.btn{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:9px 14px}
.btn{background:var(--pr2);color:#fff;border:0;font-weight:600}:root[data-theme=dark] .btn{color:#06210f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#06210f}}
.acc{margin:8px 0}.acc>button{width:100%;text-align:left;font-weight:600;display:flex;justify-content:space-between}
.acc>div{display:none;padding:12px 16px;border:1px solid var(--ln);border-top:0;border-radius:0 0 10px 10px;background:var(--sf)}.acc.open>div{display:block}.acc.open>button{border-radius:10px 10px 0 0;background:var(--soft)}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tb button.on{background:var(--pr2);color:#fff;border-color:var(--pr2)}
:root[data-theme=dark] .tb button.on{color:#06210f}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tb button.on{color:#06210f}}
.pn{display:none}.pn.on{display:block}.pn{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.flip{perspective:800px;height:150px;cursor:pointer}.flip>div{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.on>div{transform:rotateY(180deg)}
.flip p{position:absolute;inset:0;margin:0;padding:12px;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13.5px;border:1px solid var(--ln)}
.flip .f{background:var(--pr);color:#fff;font-weight:600;font-size:15px}.flip .b{background:var(--soft);transform:rotateY(180deg)}
.q{margin:14px 0}.q .o{display:block;width:100%;text-align:left;margin:6px 0;font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px 12px}
.q .o.ok{border-color:var(--ok);background:var(--soft)}.q .o.ko{border-color:var(--ko)}.q .e{display:none;font-size:14px;color:var(--mu)}.q.done .e{display:block}
.score{font-weight:700;color:var(--pr2)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--ln);padding:8px;vertical-align:top;text-align:left}th{background:var(--soft)}
.tw{overflow-x:auto}
textarea{width:100%;min-height:70px;font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px}
label.ck{display:flex;gap:8px;margin:6px 0;cursor:pointer}
.pg{display:flex;justify-content:space-between;gap:10px;margin:36px 0 20px}.pg .btn{background:var(--pr2)}
.tag{display:inline-block;background:var(--soft);border-radius:99px;padding:2px 10px;font-size:12.5px;margin:2px}
.tg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:99px}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;max-height:none;overflow:visible}nav{display:none;max-height:55vh;overflow-y:auto}nav.show{display:block}.top{display:block;margin:0 18px 12px;background:rgba(255,255,255,.15);color:#fff;border:0;padding:9px;border-radius:10px;font:inherit}.bar{margin:8px 18px}main{padding-top:16px}}
#sp{position:fixed;inset:0;z-index:50;overflow-y:auto;background:linear-gradient(160deg,#0b3d2e,#14532d 55%,#b45309);display:flex;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));transition:opacity .5s}
#sp.out{opacity:0;pointer-events:none}
#sp .box{margin:auto;width:100%;max-width:460px;background:var(--sf);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:f .6s}
#sp svg{display:block;width:100%;height:auto}
#sp .in{padding:18px 22px 24px;text-align:center}
#sp .bs{font-family:Amiri,serif;font-size:26px;color:var(--ac);margin:0}
#sp h1{font-size:21px;margin:4px 0 2px;color:var(--pr2)}
#sp p.s{margin:0 0 14px;color:var(--mu);font-size:14px}
#sp input{width:100%;font:inherit;padding:12px 14px;margin:5px 0;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);text-align:center}
#sp input:focus{outline:2px solid var(--ac)}
#sp .btn{width:100%;margin-top:12px;padding:13px;font-size:16px}
#sp .btn:disabled{opacity:.45;cursor:not-allowed}
#gm:fullscreen{background:var(--bg);overflow:auto;padding:20px}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}.gbar .btn{padding:8px 12px;font-size:14px}
.gsb{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.gs{border-radius:12px;padding:8px 4px;text-align:center;background:var(--sf);border:2px solid var(--ln);border-top:6px solid var(--c);transition:.2s;overflow:hidden}.gs b{display:block;font-size:clamp(11px,1.5vw,17px)}.gs span{font-size:clamp(22px,3.4vw,42px);font-weight:800;color:var(--c)}.gs.on{transform:scale(1.05);box-shadow:0 0 0 3px var(--ac)}.gs.lk{opacity:.4}
.gqb{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:clamp(14px,2.5vw,28px);margin:10px 0}
.gqt{font-size:clamp(18px,2.6vw,30px);font-weight:600;line-height:1.4;margin:8px 0 14px}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gopt{font:inherit;font-size:clamp(15px,2vw,24px);min-height:64px;text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer}
.gopt:disabled{opacity:.55;cursor:not-allowed}.gopt.r{background:#15803d;color:#fff;border-color:#15803d;opacity:1}.gopt.w{background:#b91c1c;color:#fff;border-color:#b91c1c;opacity:1}
.gtm{height:10px;border-radius:9px;background:var(--ln);overflow:hidden;margin:8px 0}.gtm i{display:block;height:100%;background:var(--ac);transition:width 1s linear}
.gbz{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.gbz button{font:inherit;min-height:64px;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:clamp(12px,1.7vw,20px);background:var(--c);cursor:pointer}.gbz button:disabled{opacity:.3;cursor:not-allowed}
.gbig{font-size:clamp(16px,2vw,24px)}
.gin{width:100%;font:inherit;padding:11px 14px;margin:5px 0;border:1px solid var(--ln);border-left:8px solid var(--c);border-radius:10px;background:var(--bg);color:var(--tx)}
.gmsg{margin:10px 0;font-weight:600;font-size:clamp(15px,1.8vw,22px)}
.grk{display:flex;gap:12px;align-items:center;padding:12px 16px;margin:8px 0;border-radius:14px;background:var(--bg);border:2px solid var(--ln);border-left:10px solid var(--c);font-size:clamp(16px,2.2vw,26px)}.grk b{margin-left:auto;font-size:1.4em;color:var(--c)}
@media(max-width:700px){.gopts{grid-template-columns:1fr}.gsb,.gbz{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<script>
const A={
nisa59:{ar:"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَطِيعُوا۟ ٱللَّهَ وَأَطِيعُوا۟ ٱلرَّسُولَ وَأُو۟لِى ٱلْأَمْرِ مِنكُمْ ۖ فَإِن تَنَـٰزَعْتُمْ فِى شَىْءٍ فَرُدُّوهُ إِلَى ٱللَّهِ وَٱلرَّسُولِ",ref:"Q.S. An-Nisa’ [4]: 59",tr:"Wahai orang-orang beriman, taatilah Allah, taatilah Rasul, dan ulil amri di antara kamu. Jika kamu berselisih tentang sesuatu, kembalikanlah kepada Allah (Al-Qur’an) dan Rasul (Sunnah)."},
baq2:{ar:"ذَٰلِكَ ٱلْكِتَـٰبُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ",ref:"Q.S. Al-Baqarah [2]: 2",tr:"Kitab (Al-Qur’an) ini tidak ada keraguan padanya; petunjuk bagi mereka yang bertakwa."},
hijr9:{ar:"إِنَّا نَحْنُ نَزَّلْنَا ٱلذِّكْرَ وَإِنَّا لَهُۥ لَحَـٰفِظُونَ",ref:"Q.S. Al-Hijr [15]: 9",tr:"Sesungguhnya Kamilah yang menurunkan Al-Qur’an, dan pasti Kami pula yang memeliharanya."},
anbiya107:{ar:"وَمَآ أَرْسَلْنَـٰكَ إِلَّا رَحْمَةً لِّلْعَـٰلَمِينَ",ref:"Q.S. Al-Anbiya’ [21]: 107",tr:"Dan tidaklah Kami mengutus engkau (Muhammad) melainkan sebagai rahmat bagi seluruh alam."},
baq185:{ar:"يُرِيدُ ٱللَّهُ بِكُمُ ٱلْيُسْرَ وَلَا يُرِيدُ بِكُمُ ٱلْعُسْرَ",ref:"Q.S. Al-Baqarah [2]: 185",tr:"Allah menghendaki kemudahan bagimu, dan tidak menghendaki kesukaran bagimu."},
baq195:{ar:"وَلَا تُلْقُوا۟ بِأَيْدِيكُمْ إِلَى ٱلتَّهْلُكَةِ",ref:"Q.S. Al-Baqarah [2]: 195",tr:"Janganlah kamu jatuhkan dirimu sendiri ke dalam kebinasaan."},
baq43:{ar:"وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ",ref:"Q.S. Al-Baqarah [2]: 43",tr:"Dirikanlah salat dan tunaikanlah zakat. (Ayat global yang dirinci oleh Hadis)"},
baq183:{ar:"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ",ref:"Q.S. Al-Baqarah [2]: 183",tr:"Wahai orang-orang beriman, diwajibkan atas kamu berpuasa."},
baq275:{ar:"وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟",ref:"Q.S. Al-Baqarah [2]: 275",tr:"Allah menghalalkan jual beli dan mengharamkan riba."},
nisa29:{ar:"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَأْكُلُوٓا۟ أَمْوَٰلَكُم بَيْنَكُم بِٱلْبَـٰطِلِ إِلَّآ أَن تَكُونَ تِجَـٰرَةً عَن تَرَاضٍ مِّنكُمْ",ref:"Q.S. An-Nisa’ [4]: 29",tr:"Janganlah kamu memakan harta sesamamu dengan jalan batil, kecuali dengan jalan perdagangan atas dasar suka sama suka di antara kamu."},
muth83:{ar:"وَيْلٌ لِّلْمُطَفِّفِينَ",ref:"Q.S. Al-Muthaffifin [83]: 1",tr:"Celakalah bagi orang-orang yang curang (dalam menakar dan menimbang)."},
nahl44:{ar:"وَأَنزَلْنَآ إِلَيْكَ ٱلذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ وَلَعَلَّهُمْ يَتَفَكَّرُونَ",ref:"Q.S. An-Nahl [16]: 44",tr:"Kami turunkan Adz-Dzikr (Al-Qur’an) kepadamu agar engkau menerangkan kepada manusia apa yang diturunkan kepada mereka, dan agar mereka memikirkan."},
ali31:{ar:"قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ",ref:"Q.S. Ali ‘Imran [3]: 31",tr:"Katakanlah (Muhammad), “Jika kamu mencintai Allah, ikutilah aku, niscaya Allah mencintaimu.”"},
najm3:{ar:"وَمَا يَنطِقُ عَنِ ٱلْهَوَىٰٓ ۝ إِنْ هُوَ إِلَّا وَحْىٌ يُوحَىٰ",ref:"Q.S. An-Najm [53]: 3–4",tr:"Dan tidaklah ia (Muhammad) berucap menurut keinginannya. Ucapannya itu tiada lain adalah wahyu yang diwahyukan."},
hasyr7:{ar:"وَمَآ ءَاتَىٰكُمُ ٱلرَّسُولُ فَخُذُوهُ وَمَا نَهَىٰكُمْ عَنْهُ فَٱنتَهُوا۟",ref:"Q.S. Al-Hasyr [59]: 7",tr:"Apa yang diberikan Rasul kepadamu terimalah, dan apa yang dilarangnya bagimu tinggalkanlah."},
nisa80:{ar:"مَّن يُطِعِ ٱلرَّسُولَ فَقَدْ أَطَاعَ ٱللَّهَ",ref:"Q.S. An-Nisa’ [4]: 80",tr:"Barang siapa menaati Rasul, sungguh ia telah menaati Allah."},
araf157:{ar:"وَيُحِلُّ لَهُمُ ٱلطَّيِّبَـٰتِ وَيُحَرِّمُ عَلَيْهِمُ ٱلْخَبَـٰٓئِثَ",ref:"Q.S. Al-A’raf [7]: 157",tr:"Ia menghalalkan bagi mereka segala yang baik dan mengharamkan bagi mereka segala yang buruk."},
maid32:{ar:"وَمَنْ أَحْيَاهَا فَكَأَنَّمَآ أَحْيَا ٱلنَّاسَ جَمِيعًا",ref:"Q.S. Al-Ma’idah [5]: 32",tr:"Siapa yang memelihara kehidupan seorang manusia, seakan-akan ia memelihara kehidupan seluruh manusia."},
maid90:{ar:"إِنَّمَا ٱلْخَمْرُ وَٱلْمَيْسِرُ وَٱلْأَنصَابُ وَٱلْأَزْلَـٰمُ رِجْسٌ مِّنْ عَمَلِ ٱلشَّيْطَـٰنِ فَٱجْتَنِبُوهُ",ref:"Q.S. Al-Ma’idah [5]: 90",tr:"Sesungguhnya minuman keras, berjudi, (berkurban untuk) berhala, dan mengundi nasib dengan panah adalah perbuatan keji dari setan; maka jauhilah."},
kafir6:{ar:"لَكُمْ دِينُكُمْ وَلِىَ دِينِ",ref:"Q.S. Al-Kafirun [109]: 6",tr:"Untukmu agamamu, dan untukku agamaku."},
isra32:{ar:"وَلَا تَقْرَبُوا۟ ٱلزِّنَىٰٓ ۖ إِنَّهُۥ كَانَ فَـٰحِشَةً وَسَآءَ سَبِيلًا",ref:"Q.S. Al-Isra’ [17]: 32",tr:"Janganlah kamu mendekati zina; sesungguhnya zina itu perbuatan keji dan jalan yang buruk."},
isra36:{ar:"وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ",ref:"Q.S. Al-Isra’ [17]: 36",tr:"Janganlah engkau mengikuti sesuatu yang tidak ada pengetahuanmu tentangnya."},
huj6:{ar:"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍ فَتَبَيَّنُوٓا۟",ref:"Q.S. Al-Hujurat [49]: 6",tr:"Wahai orang-orang beriman, jika datang kepadamu orang fasik membawa berita, telitilah kebenarannya (tabayyun)."},
huj11:{ar:"لَا يَسْخَرْ قَوْمٌ مِّن قَوْمٍ",ref:"Q.S. Al-Hujurat [49]: 11",tr:"Janganlah suatu kaum mengolok-olok kaum yang lain."},
huj12:{ar:"وَلَا يَغْتَب بَّعْضُكُم بَعْضًا",ref:"Q.S. Al-Hujurat [49]: 12",tr:"Dan janganlah sebagian kamu menggunjing sebagian yang lain."}};

const ay=(k,o)=>{const x=o?H[k]:A[k];return `<div class="card ay"><p class="ar">${x.ar}</p><div class="ref">${o?'📜':'📖'} ${x.ref}</div><p class="tr">${x.tr}</p></div>`};

const flip=l=>`<div class="grid">${l.map(x=>`<div class="flip" data-flip tabindex="0"><div><p class="f">${x[0]}</p><p class="b">${x[1]}</p></div></div>`).join('')}</div><small>Klik kartu untuk membalik.</small>`;

const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

{id:'bab2',t:'Bab 2: Al-Qur’an',i:'📖',b:()=>`<h2>Al-Qur’an: Sumber Utama (<i>Ashl al-Ushul</i>)</h2>
${Hh('1. Pengertian &amp; Karakteristik')}${P('Wahyu Allah Swt. kepada Nabi Muhammad ﷺ melalui Malaikat Jibril secara berangsur-angsur (±23 tahun), diawali Al-Fatihah dan diakhiri An-Nas, membacanya bernilai ibadah.')}

let G=null,gTm=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gMk=(q,t)=>({t,q:q[0],o:shuf([[q[1],1],[q[2],0],[q[3],0],[q[4],0]]),e:q[5]});
const gn=i=>esc((G.names[i]||'').trim()||'Kelompok '+(i+1));
function gStop(){clearInterval(gTm);gTm=null}
function gInit(){gStop();G={ph:'setup',names:(G&&G.names)||GT.map((_,i)=>'Kelompok '+(i+1)),sc:[0,0,0,0,0],qs:[],i:0,cur:null,rev:false,lock:[],wr:[],buz:null,msg:'',tm:0,tt:1};gDraw()}
function gStart(){G.sc=[0,0,0,0,0];G.qs=[];for(let r=0;r<2;r++)for(let t=0;t<5;t++)G.qs.push({...gMk(GQ[t][r],t),team:t});G.ph='wajib';G.i=0;gQ()}
function gRb(){const l=[];for(let t=0;t<5;t++)for(let r=2;r<5;r++)l.push(gMk(GQ[t][r],t));G.qs=shuf(l);G.ph='rebutan';G.i=0;gQ()}
function gQ(){G.cur=G.qs[G.i];G.rev=false;G.buz=null;G.lock=[];G.wr=[];G.msg='';G.tt=G.ph=='wajib'?30:20;G.tm=G.tt;gRun();gDraw()}
function gRun(){gStop();gTm=setInterval(()=>{G.tm--;const a=document.getElementById('gt'),b=document.getElementById('gtb');if(a)a.textContent=Math.max(G.tm,0);if(b)b.style.width=Math.max(G.tm,0)/G.tt*100+'%';if(G.tm<=0){gStop();gTimeout()}},1000)}
function gTimeout(){if(G.ph=='rebutan'&&G.buz!=null)gWrong(null);else{G.rev=true;G.msg='⏰ Waktu habis.'}gDraw()}
function gWrong(i){G.sc[G.buz]-=5;G.lock.push(G.buz);if(i!=null)G.wr.push(i);const n=gn(G.buz);G.buz=null;if(G.lock.length>=5){G.rev=true;G.msg='Semua kelompok sudah mencoba.';gStop()}else{G.msg='❌ '+n+' salah (−5). Kelompok lain boleh menekan buzzer!';G.tt=20;G.tm=20;gRun()}}
function gBuz(t){if(G.ph!='rebutan'||G.rev||G.buz!=null||G.lock.includes(t)||t<0||t>4)return;G.buz=t;G.msg='';G.tt=15;G.tm=15;gRun();gDraw()}
function gAns(i){if(!G.cur||G.rev||(G.ph!='wajib'&&G.ph!='rebutan')||(G.ph=='rebutan'&&G.buz==null)||G.wr.includes(i)||!(i>=0&&i<4))return;const ok=G.cur.o[i][1]==1;
if(G.ph=='wajib'){G.sel=i;G.rev=true;if(ok)G.sc[G.cur.team]+=10;G.msg=ok?'✅ Benar! +10 untuk '+gn(G.cur.team):'❌ Belum tepat.';gStop()}
else if(ok){G.sc[G.buz]+=15;G.sel=i;G.rev=true;G.msg='✅ '+gn(G.buz)+' benar! +15';gStop()}
else gWrong(i);gDraw()}
function gNext(){G.i++;if(G.i>=G.qs.length){gStop();G.ph=G.ph=='wajib'?'inter':'end';G.cur=null;gDraw()}else gQ()}
function gSB(){return '<div class="gsb">'+G.sc.map((s,t)=>`<div class="gs${(G.ph=='wajib'&&G.cur&&G.cur.team==t&&!G.rev)||(G.ph=='rebutan'&&G.buz==t)?' on':''}${G.ph=='rebutan'&&!G.rev&&G.lock.includes(t)?' lk':''}" style="--c:${GC[t]}"><b>${gn(t)}</b><span>${s}</span></div>`).join('')+'</div>'}
function gDraw(){const m=document.getElementById('gm');if(!m||!G)return;const p=G.ph;let h=`<div class="gbar"><span class="tag">${p=='setup'?'Pengaturan':p=='inter'?'Jeda':p=='end'?'Selesai':p=='wajib'?'Babak Wajib':'Babak Rebutan'}</span><span><button class="btn" data-gm="fs">⛶ Layar penuh</button> <button class="btn" data-gm="rs" style="background:var(--mu)">↺ Atur ulang</button></span></div>`;
if(p=='setup'){h+='<div class="card"><b>Nama 5 kelompok</b>'+GT.map((t,i)=>`<input class="gin" style="--c:${GC[i]}" data-gn="${i}" value="${esc(G.names[i])}" maxlength="24" aria-label="Nama kelompok ${i+1}"><small>Topik: ${t}</small>`).join('')+'<button class="btn gbig" style="width:100%;margin-top:14px;padding:14px" data-gm="st">▶ Mulai Babak Wajib</button></div>'}
else if(p=='inter'){h+=gSB()+'<div class="card" style="text-align:center"><h3>Babak Wajib selesai!</h3><button class="btn gbig" data-gm="rb" style="padding:14px 24px">⚡ Mulai Babak Rebutan</button></div>'}
else if(p=='end'){const o=[0,1,2,3,4].sort((a,b)=>G.sc[b]-G.sc[a]),top=G.sc[o[0]],w=o.filter(t=>G.sc[t]==top).map(gn).join(' &amp; ');h+=`<div class="card" style="text-align:center"><div style="font-size:56px">🏆</div><h2>Juara: ${w}</h2><p>Skor ${top}. Barakallahu fikum, semua kelompok hebat!</p></div>`+o.map((t,r)=>`<div class="grk" style="--c:${GC[t]}"><span>${['🥇','🥈','🥉','4','5'][r]}</span>${gn(t)}<b>${G.sc[t]}</b></div>`).join('')+'<p style="text-align:center"><button class="btn gbig" data-gm="rs">↺ Main Lagi</button></p>'}
else{const c=G.cur,w=p=='wajib',dis=G.rev||(!w&&G.buz==null),last=G.i==G.qs.length-1,ok=c.o.find(x=>x[1]==1)[0];
h+=gSB()+`<div class="gqb"><div class="gbig">Soal ${G.i+1}/${G.qs.length} · <span class="tag">${GT[c.t]}</span></div><div class="gbig">${w?'Giliran: <b style="color:'+GC[c.team]+'">'+gn(c.team)+'</b>':G.buz!=null?'<b style="color:'+GC[G.buz]+'">'+gn(G.buz)+'</b> menjawab!':'Tekan buzzer kelompokmu untuk menjawab!'}</div>`+(G.rev?'':`<div class="gtm"><i id="gtb" style="width:${G.tm/G.tt*100}%"></i></div><div>⏱ <b id="gt">${G.tm}</b> detik</div>`)+`<div class="gqt">${esc(c.q)}</div><div class="gopts">${c.o.map((x,i)=>`<button class="gopt${G.rev&&x[1]?' r':''}${(G.rev&&G.sel==i&&!x[1])||G.wr.includes(i)?' w':''}" data-gm="a" data-i="${i}"${dis||G.wr.includes(i)?' disabled':''}>${'ABCD'[i]}. ${esc(x[0])}</button>`).join('')}</div>`+(!w&&!G.rev?`<div class="gbz">${GT.map((_,t)=>`<button style="--c:${GC[t]}" data-gm="b" data-t="${t}"${G.buz!=null||G.lock.includes(t)?' disabled':''}>🔔 ${gn(t)}</button>`).join('')}</div>`:'')+(G.msg?`<div class="gmsg">${G.msg}</div>`:'')+(G.rev?`<div class="card"><b>Jawaban: ${esc(ok)}</b><br>💡 ${esc(c.e)}</div><button class="btn gbig" data-gm="n" style="padding:14px 24px">${last?'Lanjut →':'Soal berikutnya →'}</button>`:`<p><button class="btn" data-gm="s" style="background:var(--mu)">Lewati soal</button></p>`)+'</div>'}
m.innerHTML=h}
document.addEventListener('click',e=>{const x=e.target.closest('[data-gm]');if(!x||!G)return;const a=x.dataset.gm;
if(a=='st')gStart();else if(a=='a')gAns(+x.dataset.i);else if(a=='b')gBuz(+x.dataset.t);else if(a=='n')gNext();else if(a=='rb')gRb();
else if(a=='s'){if(G.cur&&!G.rev){G.rev=true;G.msg='Soal dilewati.';gStop();gDraw()}}
else if(a=='rs'){gStop();G.ph='setup';G.cur=null;gDraw()}
else if(a=='fs'){const m=document.getElementById('gm');try{const f=m.requestFullscreen||m.webkitRequestFullscreen,r=f&&f.call(m);if(r&&r.catch)r.catch(()=>{})}catch(_){}}});
document.addEventListener('input',e=>{if(G&&e.target.dataset&&e.target.dataset.gn!=null)G.names[+e.target.dataset.gn]=e.target.value});
document.addEventListener('keydown',e=>{if(cur!='game'||!G||!G.cur||e.target.tagName=='INPUT'||e.target.tagName=='TEXTAREA')return;const k=e.key.toLowerCase();if(k.length!=1)return;if('12345'.includes(k))gBuz(+k-1);else if('abcd'.includes(k))gAns('abcd'.indexOf(k))});
const S=(()=>{try{return JSON.parse(localStorage.getItem('mpi')||'{}')}catch(e){return{}}})();
S.v=S.v||{};S.q=S.q||{};S.c=S.c||{};S.n=S.n||{};
const save=()=>{try{localStorage.setItem('mpi',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),V=$('#v');
let cur='pengantar';const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function nav(){$('#nav').innerHTML=C.map(c=>`<button data-go="${c.id}" class="${c.id==cur?'on':''}"><span>${c.i}</span><span>${c.t}</span><span class="d">${S.q[c.id]!=null?'✅':S.v[c.id]?'●':''}</span></button>`).join('');
const done=C.filter(c=>S.v[c.id]).length,p=Math.round(done/C.length*100);$('#pb').style.width=p+'%';$('#pt').textContent=`${S.u?S.u.n+' · '+S.u.k+' — ':''}Progres: ${done}/${C.length} bagian dibuka`}
function render(){gStop();const i=C.findIndex(c=>c.id==cur),c=C[i];U=0;S.v[cur]=1;save();
V.innerHTML=c.b()+`<div class="pg">${i>0?`<button class="btn" data-go="${C[i-1].id}">← ${C[i-1].t}</button>`:'<span></span>'}${i<C.length-1?`<button class="btn" data-go="${C[i+1].id}">${C[i+1].t} →</button>`:'<span></span>'}</div>`;
V.querySelectorAll('[data-ck]').forEach(e=>e.checked=!!S.c[e.dataset.ck]);
V.querySelectorAll('[data-note]').forEach(e=>e.value=S.n[e.dataset.note]||'');
$('#main').scrollTo(0,0);nav();$('#nav').classList.remove('show');if(c.init)c.init()}
function go(id){cur=C.some(c=>c.id==id)?id:'pengantar';try{history.replaceState(null,'','#'+cur)}catch(e){}render()}
function route(){const h=location.hash.slice(1);cur=C.some(c=>c.id==h)?h:'pengantar';render()}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!=cur)route()});
document.addEventListener('click',e=>{const t=e.target;let x;
if(x=t.closest('[data-go]'))return go(x.dataset.go);
if(x=t.closest('[data-acc]')){const a=x.parentElement;a.classList.toggle('open');x.lastChild.textContent=a.classList.contains('open')?'－':'＋';return}
if(x=t.closest('[data-tab]')){const g=x.closest('.tabs'),i=+x.dataset.tab;g.querySelectorAll(':scope>.tb button').forEach((b,j)=>b.classList.toggle('on',j==i));g.querySelectorAll(':scope>.pn').forEach((p,j)=>p.classList.toggle('on',j==i));return}
if(x=t.closest('[data-flip]'))return x.classList.toggle('on');
if(x=t.closest('.q .o')){const q=x.closest('.q');if(q.classList.contains('done'))return;q.classList.add('done');const a=+q.dataset.a,o=+x.dataset.o;q.querySelectorAll('.o').forEach((b,j)=>{if(j==a)b.classList.add('ok');else if(j==o)b.classList.add('ko')});if(o==a)q.dataset.r=1;
const z=q.closest('[data-quiz]'),n=+z.dataset.n,d=z.querySelectorAll('.q.done').length;
if(d==n){const s=z.querySelectorAll('.q[data-r]').length;z.querySelector('.score').textContent=`Skor: ${s}/${n} ${s==n?'🎉 Luar biasa!':'— tinjau ulang penjelasan di atas.'}`;S.q[z.dataset.quiz]=s;save();nav()}return}});
document.addEventListener('change',e=>{if(e.target.dataset.ck){S.c[e.target.dataset.ck]=e.target.checked;save()}});
document.addEventListener('input',e=>{if(e.target.dataset.note){S.n[e.target.dataset.note]=e.target.value;save()}});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.dataset.flip!=null&&e.target.matches('[data-flip]')){e.preventDefault();e.target.classList.toggle('on')}});
$('#mb').onclick=()=>$('#nav').classList.toggle('show');
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#0f1a14';r.dataset.theme=d?'light':'dark'};
const sp=$('#sp'),sn=$('#sn'),sk=$('#sk'),sb=$('#sbtn');
if(S.u){sn.value=S.u.n;sk.value=S.u.k}
const chk=()=>{sb.disabled=!(sn.value.trim()&&sk.value.trim())};chk();
sn.oninput=sk.oninput=chk;
const start=()=>{if(sb.disabled)return;S.u={n:sn.value.trim(),k:sk.value.trim()};save();sp.classList.add('out');setTimeout(()=>sp.remove(),500);route()};
sb.onclick=start;sn.onkeydown=sk.onkeydown=e=>{if(e.key=='Enter')start()};
route();
</script>
</body>
</html>
